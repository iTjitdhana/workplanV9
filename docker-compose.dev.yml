services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env.development
    ports:
      - "${WEB_PORT:-3011}:3011"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - workplan-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.development
    ports:
      - "${API_PORT:-3101}:3101"
    restart: unless-stopped
    networks:
      - workplan-network

networks:
  workplan-network:
    driver: bridge
