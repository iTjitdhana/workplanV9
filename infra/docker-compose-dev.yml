version: '3.8'

services:
  # Frontend Service
  frontend:
    build: 
      context: ../frontend
      dockerfile: Dockerfile
      target: builder
    container_name: workplan-frontend-dev
    ports:
      - "3019:3019"
    volumes:
      # Mount source code สำหรับ hot reload
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      - PORT=3019
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- -p 3019 -H 0.0.0.0"
    depends_on:
      - backend
    networks:
      - workplan-network
    restart: unless-stopped

  # Backend Service
  backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    container_name: workplan-backend-dev
    ports:
      - "3109:3109"
    volumes:
      # Mount source code สำหรับ hot reload
      - ../backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - DB_NAME=${DB_NAME:-manufacturing_system}
      - DB_PORT=${DB_PORT:-3306}
    depends_on:
      - mysql
    networks:
      - workplan-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: workplan-mysql-dev
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=workplan
      - MYSQL_USER=workplan_user
      - MYSQL_PASSWORD=workplan_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ../tools/utilities/mysql-config.cnf:/etc/mysql/conf.d/custom.cnf
    networks:
      - workplan-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: workplan-nginx-dev
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - workplan-network
    restart: unless-stopped

volumes:
  mysql_data:
  frontend_node_modules:
  frontend_next:

networks:
  workplan-network:
    driver: bridge
